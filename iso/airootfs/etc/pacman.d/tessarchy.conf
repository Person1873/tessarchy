# Tessarchy package repository.
#
# An installed machine gets Tessarchy updates from here: the shell, the session
# config and the greeter are pacman packages, so `tessarchy-update --apply`
# downloads only what changed instead of a new ISO. The repository is plain
# static files, served from the project website; point Server at a local mirror
# (or a USB folder) by editing tessarchy-update's --repo.
#
# SigLevel is Optional TrustAll because the repository is not signed yet: the
# packages are fetched over HTTPS from the project's own site. Signing the
# database with a project key is the next step — until then, treat a changed
# Server here the same way you would treat a changed mirror.
[tessarchy]
SigLevel = Optional TrustAll
Server = https://thediamondsaint.github.io/tessarchy/pkgs/$arch
