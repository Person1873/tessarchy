LABEL existing
TEXT HELP
Boot an existing operating system.
Press TAB to edit the disk and partition number to boot.
ENDTEXT
MENU LABEL Boot an existing OS
COM32 chain.c32
APPEND hd0 0

# https://www.memtest.org/
LABEL memtest
MENU LABEL Memtest86+ (memory test)
LINUX /boot/memtest86+/memtest

LABEL reboot
TEXT HELP
Reboot the machine.
The firmware must support APM.
ENDTEXT
MENU LABEL Reboot
COM32 reboot.c32

LABEL poweroff
TEXT HELP
Power the machine off.
The firmware must support APM.
ENDTEXT
MENU LABEL Power off
COM32 poweroff.c32
