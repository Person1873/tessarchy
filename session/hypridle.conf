# Tessarchy idle handling. This blanks the panel after five minutes without
# input and brings it back on the next input. It deliberately configures no
# lock command: Tessarchy does not claim session locking.
general {
}

listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
