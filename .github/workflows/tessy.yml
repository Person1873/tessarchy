name: Tessy announcements

# Tessy posts repository activity to the project Discord channel through a
# webhook. Add the channel webhook URL as the DISCORD_WEBHOOK_URL repository
# secret; without it the job skips cleanly. See docs/tessy.md.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, closed]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Announce activity to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
        run: python3 scripts/tessy-notify.py
