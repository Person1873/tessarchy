name: checks
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git python lua shellcheck \
            hyprland quickshell qt6-base qt6-declarative qt6-wayland
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run static and integration checks
        run: ./scripts/check.sh
